<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Virtual - Dados</title>
    <link rel="stylesheet" href="styles2.css">


    <style>
        /* Estilo da janela flutuante */
        #janelaFlutuante {
            width: 100%;
            height: 100%px;
     /*     position: fixed; */
            top: 10px;
            left: 10p;
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
        }
        #janelaFlutuante.minimizado {
            height: 40px; /* Mostra apenas a barra */
        }
        #janelaFlutuante iframe {
            width: 100%;
            height: calc(100% - 40px); /* Espaço para a barra de título */
            border: none;
        }
        #barraTitulo {
            padding: 1px;
            background-color: #333;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            user-select: none;
            cursor: grab;
        }
        .botao {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
        }
    </style>






    <script>
        // Função para exibir a confirmação de saída da página
        window.onbeforeunload = function() {
            return "Tem certeza que deseja sair ou recarregar a página? Alterações podem ser perdidas.";
        };

        // Desativar arrastar imagens no documento
        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
      </script>
</head>
<body>
   




<div class="fixed-buttons">
<!-- botoes -->
     </div>






















    <!-- Contêiner para as colunas (decks à esquerda, mesa à direita) -->
    <div class="layout-container">
      
            
        


        <!-- Coluna da direita (mesa de jogo) -->
        <div class="right-colun">
            
        <button onclick="adjustZoom('increase')">Mesa +</button>
        <button onclick="adjustZoom('decrease')">Mesa -</button>




    
            <div class="table-wrapper" id="table-wrapper">
                <div class="table-area" id="table-area">
                    <!-- Cartas sorteadas aparecerão aqui -->
                </div>
            </div>
        </div>
    </div>



      
      
      
      
      


















 <!-- Pop-up para seleção de cartas -->
    <div id="card-selector" class="card-selector hidden">
        <div id="card-selector-content" class="card-selector-content"></div>
        <button onclick="closeCardSelector()">Fechar</button>
    </div>

  





<!-- Pop-up de opções para cartas -->
<div id="card-options" class="card-options hidden">
    <button id="duplicate-btn" onclick="duplicateCard()">Duplicar</button> <!-- Novo botão -->
    <button id="delete-btn" onclick="deleteCard()">Apagar</button> <!-- Novo botão -->
    <button id="lock-button" onclick="toggleLockCard()">Travar/Destravar</button>
    <button id="rotate-btn" onclick="rotateCard()">Rotacionar</button>
    <button id="bring-to-front-btn"button id="flip-btn" onclick="flipCard()">Virar Carta</button>
    <button id="group-and-flip-btn" onclick="bringCardToFront()">Frente/Tras</button>
    <button id="grouping-open-popup-btn" onclick="openGroupingOptions()">Agrupamento</button> <!-- Botão de agrupamento -->
    <button id="resize-open-popup-btn" onclick="openResizeOptions_cartas()">Redimensionar</button> <!-- Botão para abrir a mini popup -->
            <button id="return-to-deck-btn" onclick="returnCardToDeck()">Retornar para o Deck</button> <!-- Novo botão -->
<button id="groupReturnButton">Agrupar e Retornar Cartas</button>
<button onclick="adjustZoom('increase')"> Mesa +</button> <!-- botão de zoom da mesa   -->
<button onclick="adjustZoom('decrease')"> Mesa - </button> <!-- botão de zoom da mesa   -->
<button id="reload-card-btn" onclick="reloadCardImage()">Recarregar Imagem</button> <!-- Novo botão -->
    <button class="close-button" onclick="closeCardOptions()">Fechar</button>
</div>
