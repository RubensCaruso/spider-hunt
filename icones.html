<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cartas separadas -->
    <rect x="5" y="5" width="12" height="18" rx="2" ry="2"></rect>
    <rect x="15" y="10" width="12" height="18" rx="2" ry="2"></rect>
    <rect x="25" y="15" width="12" height="18" rx="2" ry="2"></rect>
    
    <!-- Pilha final -->
    <rect x="32" y="20" width="12" height="18" rx="2" ry="2"></rect>
    
    <!-- Setas indicando o agrupamento -->
    <path d="M 12 18 L 20 22" stroke-width="2"></path>
    <path d="M 22 22 L 30 26" stroke-width="2"></path>
  </svg> Agrupar
</button>
    


<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carta -->
    <rect x="10" y="10" width="30" height="40" rx="2" ry="2"></rect>
    
    <!-- Setas de expansão -->
    <line x1="5" y1="5" x2="15" y2="15"></line>
    <line x1="5" y1="15" x2="15" y2="5"></line>
    
    <line x1="35" y1="35" x2="45" y2="45"></line>
    <line x1="35" y1="45" x2="45" y2="35"></line>
  </svg> Aumentar
</button>
    

<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carta -->
    <rect x="10" y="10" width="30" height="40" rx="2" ry="2"></rect>
    
    <!-- Símbolo de "+" no centro -->
    <line x1="25" y1="20" x2="25" y2="30"></line>
    <line x1="20" y1="25" x2="30" y2="25"></line>
  </svg> Aumentar
</button>
    



<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <rect x="10" y="10" width="30" height="40" rx="2" ry="2"></rect>

</button>
    


<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carta acima -->
    <rect x="15" y="5" width="20" height="30" rx="2" ry="2"></rect>
    
    <!-- Pilha de cartas (deck) abaixo -->
    <rect x="10" y="35" width="30" height="10" rx="2" ry="2"></rect>
    
    <!-- Seta apontando para o deck -->
    <line x1="25" y1="20" x2="25" y2="32"></line>
    <polyline points="20,27 25,32 30,27"></polyline>
  </svg> Retornar
</button>
    



<button>
  <svg width="40" height="40" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carta original -->
    <rect x="5" y="5" width="20" height="30" rx="2" ry="2"></rect>
    
    <!-- Carta duplicada -->
    <rect x="25" y="5" width="20" height="30" rx="2" ry="2"></rect>
    
    <!-- Seta indicando duplicação -->
    <line x1="25" y1="20" x2="30" y2="20"></line>
    <polyline points="25,15 30,20 25,25"></polyline>
  </svg> Duplicar
</button>
    


<button>
